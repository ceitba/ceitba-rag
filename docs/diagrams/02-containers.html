    <h1>ceitba-rag containers</h1>
    <p class="subtitle">Go query-api on the hot path, Python workers for ingestion (ADR 0002); Postgres also holds the job queue (ADR 0009), Garage the content-addressed mirror (ADR 0010), Valkey the exact cache and rate limits (ADR 0013, 0014).</p>
